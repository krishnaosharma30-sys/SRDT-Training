<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LendLoop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>LendLoop</h1>
        <p>Share More. Spend Less.</p>
    </header>

    <main>
        <h2>Need It? Borrow It.</h2>

        <p>
            Borrow useful items from students
            on your campus.
        </p>

        <button>Browse Items</button>

        <h2>Available Items</h2>

        <div class="item">
            <h3>Book</h3>
            <p>Engineering Mathematics</p>
        </div>

        <div class="item">
            <h3>Calculator</h3>
            <p>Scientific Calculator</p>
        </div>
    </main>

</body>
</html>
